version: '3.8'

services:
  # ==========================================================================
  # AIC Application
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: aic-api
    ports:
      - "8000:8000"
    environment:
      - AIC_ENV=development
      - AIC_DEBUG=true
      - AIC_LOG_LEVEL=DEBUG
      - AIC_DATABASE_URL=postgresql+asyncpg://aic:aic_dev_password@postgres:5432/aic
      - AIC_REDIS_URL=redis://redis:6379/0
      - AIC_QDRANT_HOST=qdrant
      - AIC_QDRANT_PORT=6333
      - AIC_OTLP_ENDPOINT=http://jaeger:4317
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - aic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: aic-postgres
    environment:
      POSTGRES_DB: aic
      POSTGRES_USER: aic
      POSTGRES_PASSWORD: aic_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aic -d aic"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: aic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - aic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Qdrant Vector Store
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aic-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - aic-network
    restart: unless-stopped

  # ==========================================================================
  # Observability Stack
  # ==========================================================================

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: aic-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - aic-network
    restart: unless-stopped

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: aic-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - aic-network
    restart: unless-stopped

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aic-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    networks:
      - aic-network
    restart: unless-stopped

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres_data:
    name: aic_postgres_data
  redis_data:
    name: aic_redis_data
  qdrant_data:
    name: aic_qdrant_data
  prometheus_data:
    name: aic_prometheus_data
  grafana_data:
    name: aic_grafana_data

# ==========================================================================
# Networks
# ==========================================================================
networks:
  aic-network:
    name: aic-network
    driver: bridge
