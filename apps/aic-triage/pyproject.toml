[project]
name = "aic-triage"
version = "0.1.0"
description = "Polls for TRIAGING incidents and runs the triage stage (design doc §1.4 TRIAGE row, T6)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "aic-database",
    "aic-agents",
    "openai>=1.40",
]

[project.scripts]
aic-triage = "aic_triage.main:main"

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }
aic-database = { workspace = true }
aic-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_triage"]
