[project]
name = "aic-executor"
version = "0.1.0"
description = "Polls for approved actions and executes them for real through the write-scoped aic-executor K8s credential (design doc §1.4 ACT row, §1.11, ADR 0003, T10)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "aic-database",
    "aic-agents",
]

[project.scripts]
aic-executor = "aic_executor.main:main"

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }
aic-database = { workspace = true }
aic-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_executor"]
