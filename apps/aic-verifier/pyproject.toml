[project]
name = "aic-verifier"
version = "0.1.0"
description = "Polls for VERIFYING incidents and re-checks real Prometheus/Loki metrics against the original alert thresholds after a soak window (design doc §1.4 VERIFY/RESOLVE rows, §1.12, T11)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "aic-database",
    "aic-agents",
    "httpx>=0.27",
]

[project.scripts]
aic-verifier = "aic_verifier.main:main"

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }
aic-database = { workspace = true }
aic-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_verifier"]
