[project]
name = "aic-investigator"
version = "0.1.0"
description = "Polls for INVESTIGATING incidents without an RCA yet and runs the investigation graph (design doc §1.6/§1.7, T7)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "aic-database",
    "aic-agents",
    "openai>=1.40",
]

[project.scripts]
aic-investigator = "aic_investigator.main:main"

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }
aic-database = { workspace = true }
aic-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_investigator"]
