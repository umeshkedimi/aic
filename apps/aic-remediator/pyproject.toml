[project]
name = "aic-remediator"
version = "0.1.0"
description = "Polls for investigated incidents and runs remediation planning + policy application (design doc §1.4 PLAN REMEDIATION/APPLY POLICY rows, T8)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "aic-database",
    "aic-agents",
    "openai>=1.40",
]

[project.scripts]
aic-remediator = "aic_remediator.main:main"

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }
aic-database = { workspace = true }
aic-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_remediator"]
