[project]
name = "aic-correlator"
version = "0.1.0"
description = "Consumes alert-events and groups correlated alerts into Incidents (design doc §1.4 CORRELATE row, ADR 0002 consumer group aic-correlator)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "aic-database",
    "aic-contracts",
    "aic-eventbus",
]

[project.scripts]
aic-correlator = "aic_correlator.main:main"

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }
aic-database = { workspace = true }
aic-contracts = { workspace = true }
aic-eventbus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_correlator"]
