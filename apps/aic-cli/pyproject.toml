[project]
name = "aic-cli"
version = "0.1.0"
description = "Operator CLI: `aic approve <incident-id>` (design doc §1.10 APPROVE row, T9)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "aic-database",
    "aic-agents",
]

[project.scripts]
aic = "aic_cli.main:main"

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }
aic-database = { workspace = true }
aic-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_cli"]
