[project]
name = "aic-ingest"
version = "0.1.0"
description = "Receives Alertmanager webhooks, normalizes them to AlertEvent, and produces to the alert-events Kafka topic (design doc §1.4 CORRELATE row, ADR 0002)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "aic-contracts",
    "aic-eventbus",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
aic-ingest = "aic_ingest.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "testcontainers>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }
aic-contracts = { workspace = true }
aic-eventbus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_ingest"]
