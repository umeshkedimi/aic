[project]
name = "aic-checkout-service"
version = "0.1.0"
description = "Toy checkout-service: calls payment-service and surfaces its failures as real 5xx (design doc §1.2)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = []

[tool.uv.sources]
aic-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_service"]
