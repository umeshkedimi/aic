[project]
name = "aic-agents"
version = "0.1.0"
description = "LLMPort abstraction and the LiteLLM-backed adapter behind it (ADR 0004)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "aic-database",
    "pydantic>=2.9",
    "openai>=1.40",
    "langgraph>=1.2.11",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "testcontainers>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }
aic-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_agents"]
