[project]
name = "aic-eventbus"
version = "0.1.0"
description = "EventBusPort abstraction over the alert-events Kafka topic, with an aiokafka-backed adapter (ADR 0002)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "pydantic>=2.9",
    "aiokafka>=0.11",
]

[dependency-groups]
dev = [
    "testcontainers>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_eventbus"]
