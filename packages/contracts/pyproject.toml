[project]
name = "aic-contracts"
version = "0.1.0"
description = "Wire contracts shared between aic-ingest and aic-correlator across the alert-events Kafka topic (design doc §1.8)."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "pydantic>=2.9",
]

[dependency-groups]
dev = []

[tool.uv.sources]
aic-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_contracts"]
