[project]
name = "aic-database"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "aic-common",
    "aic-domain",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_database"]
