[project]
name = "aic-database"
version = "0.1.0"
description = "SQLAlchemy models and Alembic migrations for the AIC system-of-record schema."
requires-python = ">=3.13"
dependencies = [
    "aic-common",
    "aic-domain",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
aic-common = { workspace = true }
aic-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_database"]
