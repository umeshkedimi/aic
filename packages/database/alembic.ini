[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Overridden at runtime by env.py from the AIC_DATABASE_URL env var
# (aic_database.session.DatabaseSettings). This is only the fallback used
# when that var isn't set, e.g. `alembic history` with no DB reachable.
sqlalchemy.url = postgresql+psycopg://aic:aic@localhost:5432/aic

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
