[project]
name = "aic-common"
version = "0.1.0"
description = "Shared foundational utilities for AIC: config, structured logging, ids, clock, base errors."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic_common"]
