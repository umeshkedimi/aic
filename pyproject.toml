[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages", "apps"]
# Alembic-generated migrations are machine output, not hand-authored code —
# linting them just fights the autogenerate formatter.
extend-exclude = ["packages/database/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = [
    "packages/common/src",
    "packages/domain/src",
    "packages/database/src",
    "apps/payment-service/src",
    "apps/checkout-service/src",
    "apps/toy-ops/src",
]
explicit_package_bases = true
files = [
    "packages/common/src",
    "packages/common/tests",
    "packages/domain/src",
    "packages/domain/tests",
    "packages/database/src",
    "packages/database/tests",
    "packages/database/alembic",
    "apps/payment-service/src",
    "apps/payment-service/tests",
    "apps/checkout-service/src",
    "apps/checkout-service/tests",
    "apps/toy-ops/src",
    "apps/toy-ops/tests",
]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/common/tests",
    "packages/domain/tests",
    "packages/database/tests",
    "apps/payment-service/tests",
    "apps/checkout-service/tests",
    "apps/toy-ops/tests",
]
