# Loki for the toy system's structured JSON logs (design doc §1.3/§1.4
# OBSERVE row: "Promtail ships structured JSON logs to Loki", T3).
#
# Single-binary, filesystem-backed config — this is Grafana's documented
# minimal local config (boltdb-shipper + filesystem chunks store), not a
# production HA setup. emptyDir storage is intentional: like the toy
# system's own Postgres (infra/kind/postgres.yaml), this is a resettable
# demo fixture, not data anyone needs to survive a pod restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: aic-demo
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: aic-demo
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.8
          args:
            - -config.file=/etc/loki/loki-config.yaml
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki-config.yaml
              subPath: loki-config.yaml
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: aic-demo
spec:
  # NodePort (not ClusterIP), matching Prometheus/Alertmanager (T3): T7's
  # investigation graph runs loki.query_range as a host process, like
  # aic-ingest/aic-correlator/aic-triage, and needs to reach Loki without a
  # standing `kubectl port-forward` — see infra/kind/kind-config.yaml.
  type: NodePort
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
      nodePort: 30100
