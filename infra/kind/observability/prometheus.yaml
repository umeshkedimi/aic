# Prometheus for the toy system (design doc §1.3/§1.4 OBSERVE/DETECT, T3).
#
# Scrapes checkout-service and payment-service directly via their stable
# in-cluster Service DNS names every 5s (design doc §1.4: "every 5s"), and
# evaluates the three alert rules in alert-rules.yaml against real traffic —
# no kubernetes_sd_configs / extra RBAC needed since the scrape targets are
# exactly the two known services, not an open-ended pod set.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: aic-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/rules/alert-rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: checkout-service
        static_configs:
          - targets: ["checkout-service:8000"]
            labels:
              app: checkout-service
      - job_name: payment-service
        static_configs:
          - targets: ["payment-service:8000"]
            labels:
              app: payment-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: aic-demo
data:
  # Thresholds tuned against real T2 traffic (see T2's task-board note):
  # good config (pool=20) ran 100% 200s at ~120ms p99; bad config (pool=3,
  # v42) pushed p99 to ~2.87s with genuine 503/502s and the pool gauge
  # pinned at its cap. `for: 15s` (three consecutive 5s evaluations) keeps
  # all three rules from flapping on a single noisy scrape while still
  # firing within seconds of each other once the fault is sustained, per
  # design doc §1.4's DETECT row.
  alert-rules.yml: |
    groups:
      - name: payment-service-fault
        rules:
          - alert: HighLatencyPaymentService
            expr: >
              histogram_quantile(0.99,
                sum(rate(http_request_duration_seconds_bucket{app="payment-service"}[1m])) by (le)
              ) > 1
            for: 15s
            labels:
              severity: critical
              service: payment-service
            annotations:
              summary: "payment-service p99 latency above 1s"
              description: >
                payment-service p99 request latency has stayed above 1s for 15s,
                consistent with requests blocking on DB pool acquisition.

          - alert: HighErrorRatePaymentService
            expr: >
              sum(rate(http_requests_total{app="payment-service",status=~"5.."}[1m]))
              /
              sum(rate(http_requests_total{app="payment-service"}[1m])) > 0.05
            for: 15s
            labels:
              severity: critical
              service: payment-service
            annotations:
              summary: "payment-service 5xx rate above 5%"
              description: >
                More than 5% of payment-service requests have returned 5xx over
                the last minute, sustained for 15s.

          - alert: DBPoolExhaustionPaymentService
            expr: db_pool_connections_in_use{app="payment-service"} >= db_pool_max_size{app="payment-service"}
            for: 15s
            labels:
              severity: critical
              service: payment-service
            annotations:
              summary: "payment-service DB pool pinned at its configured max"
              description: >
                db_pool_connections_in_use has been at db_pool_max_size for 15s —
                the pool is genuinely exhausted, not just busy.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aic-demo
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-alert-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aic-demo
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
