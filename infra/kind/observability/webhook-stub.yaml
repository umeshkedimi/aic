# Placeholder Alertmanager receiver (design doc §1.4 DETECT row: "Each fires
# a webhook to aic-ingest"; T3 scope note: "a stub endpoint is fine — T4
# implements the real one"). mendhak/http-https-echo logs every request
# (headers + body) to stdout as JSON and echoes it back, so T3's Done
# criterion — observing the three real webhooks via `kubectl logs` — needs
# no code of our own that T4 would just delete. T4 replaces this Service's
# backing Deployment with the real `aic-ingest` FastAPI app; Alertmanager's
# route (alertmanager.yaml) targets the Service name, not this Deployment,
# so that swap doesn't require touching alertmanager.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook-stub
  namespace: aic-demo
  labels:
    app: alert-webhook-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook-stub
  template:
    metadata:
      labels:
        app: alert-webhook-stub
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:31
          env:
            - name: HTTP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook-stub
  namespace: aic-demo
spec:
  type: NodePort
  selector:
    app: alert-webhook-stub
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
