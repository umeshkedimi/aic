# Promtail: tails checkout-service/payment-service's structured JSON logs
# from each kind node's real pod-log files and ships them to Loki (design
# doc §1.3/§1.4 OBSERVE row, T3).
#
# RBAC follows the same namespace-scoped pattern as aic-investigator/
# aic-executor (infra/kind/rbac.yaml): kubernetes_sd_configs' `namespaces:
# names: [aic-demo]` filter restricts pod discovery to the
# /api/v1/namespaces/aic-demo/pods endpoint, so a namespaced Role
# (get/list/watch on pods, aic-demo only) is enough — no ClusterRole needed
# even though this runs as a DaemonSet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: aic-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promtail
  namespace: aic-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promtail
  namespace: aic-demo
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: aic-demo
roleRef:
  kind: Role
  name: promtail
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: aic-demo
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: aic-demo-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["aic-demo"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
        pipeline_stages:
          - json:
              expressions:
                level: level
                event: event
          - labels:
              level:
              event:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: aic-demo
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.8
          args:
            - -config.file=/etc/promtail/promtail.yaml
          env:
            # Promtail scopes its kubernetes_sd_configs discovery to pods on
            # its own node via a spec.nodeName field selector keyed off
            # $HOSTNAME. Without this override HOSTNAME defaults to the
            # container's own hostname (this pod's name), which matches no
            # real node and silently discovers zero targets.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail/promtail.yaml
              subPath: promtail.yaml
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        - name: positions
          emptyDir: {}
