# checkout-service's config never changes across the "good"/"bad" fault
# injection (only payment-service's DB_POOL_SIZE does, via the deploy
# script), so this manifest is static.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: aic-demo
  labels:
    app: checkout-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: checkout-service
          image: checkout-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8000"
            - name: SERVICE_VERSION
              value: "v1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: aic-demo
spec:
  type: NodePort
  selector:
    app: checkout-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
